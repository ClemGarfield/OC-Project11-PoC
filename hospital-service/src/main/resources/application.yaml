spring:
  application:
    name: hospital-service

  datasource:
    url: jdbc:h2:mem:medheaddb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none

  logging:
    level:
      org.springframework.jdbc.datasource.init: DEBUG

server:
  port: 8085